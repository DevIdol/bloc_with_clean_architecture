name: Flutter CI

on:
  pull_request:
    types: [opened, synchronize]
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  lint-and-test:
    name: Lint, Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Use FVM and Setup Flutter
        uses: kuhnroyal/flutter-fvm-config-action@v2
        id: fvm-config-action
        with:
          path: ".fvmrc"

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true
          cache-key: flutter-${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          cache-path: ${{ runner.tool_cache }}/flutter

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            **/pubspec.lock
          key: pub-cache-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-cache-

      - name: Install Dependencies
        run: flutter pub get

      - name: Format Code
        run: dart format --set-exit-if-changed .
        continue-on-error: false

      - name: Analyze Code
        run: dart analyze --fatal-infos --fatal-warnings .
        continue-on-error: false

      - name: Run Unit Tests
        run: flutter test --coverage
        continue-on-error: false

      - name: Upload Test Coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: true

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: lint-and-test

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: android
          - os: macos-latest
            platform: ios

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: 🐦 Use FVM and Setup Flutter
        uses: kuhnroyal/flutter-fvm-config-action@v2
        id: fvm-config-action
        with:
          path: ".fvmrc"

      - name: 🌍 Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true
          cache-key: flutter-${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          cache-path: ${{ runner.tool_cache }}/flutter

      - name: ✅ Verify Flutter Installation
        run: flutter --version

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔐 Create config.dev.json from Secret
        run: |
          echo "${{ secrets.CONFIG_DEV_JSON }}" | base64 -d > config.dev.json

      - name: 🧹 Clean Project
        run: flutter clean

      - name: 🏭 Build for ${{ matrix.platform }}
        run: |
          if [ "${{ matrix.platform }}" == "android" ]; then
            flutter build apk --debug --dart-define-from-file=config.dev.json
          elif [ "${{ matrix.platform }}" == "ios" ]; then
            flutter build ios --debug --no-codesign --dart-define-from-file=config.dev.json
            mkdir -p Payload
            cp -r build/ios/iphonesimulator/*.app Payload/
            zip -r debug.ipa Payload
          fi

      - name: 📂 Upload Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mtmknowsync-${{ matrix.platform }}-build
          path: |
            build/app/outputs/flutter-apk/*.apk
            debug.ipa
          retention-days: 7
